name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP 8.4 / Swoole 6.2
    runs-on: ubuntu-latest
    # 挂住(如进程无法退出)按失败处理,避免无限等待
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate, install, lint, analyse and test
        run: |
          docker run --rm --network host -e DB_HOST=127.0.0.1 -e REDIS_HOST=127.0.0.1 \
            -v "$PWD":/app -w /app hyperf/hyperf:8.4-alpine-v3.22-swoole-v6.2 sh -c '
            set -e
            php -v | head -1
            php --ri swoole | grep -i "^version"
            composer validate
            composer update --no-interaction --no-progress --prefer-dist
            find app config test -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null
            composer analyse
            composer test
            php bin/hyperf.php describe:routes > /dev/null
          '
